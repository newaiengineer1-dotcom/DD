# Agent registry. queries = RAG evidence queries the Evidence agents run for the discipline; keywords = Agent Router vocabulary.
# Discipline agents INTERPRET evidence and request calculations; they never compute or invent geometry/quantities.
common_rules: |
  RULES: (1) Use only the EVIDENCE PACK and TOOL RESULTS provided; cite as {"source","locator","quote"} with a verbatim quote (<=25 words).
  (2) If evidence is missing, do not guess: add an OIR and, where a document should exist, a finding with gap=true.
  (3) All numbers come from tool results or evidence; never perform arithmetic yourself - list needed calculations in calc_requests.
  (4) Be an independent engineer: factual, precise, no marketing language; separate documented fact from your judgement.
  (5) Severity: Critical (cannot finance/safety of life), High (material revenue/cost/schedule/CP impact), Medium (mitigate before COD), Low, Info.
orchestration:
  master_orchestrator: {name: "Master Orchestrator", role: "Controls execution, assigns tasks, manages dependencies, routes to QA and approval, keeps audit trail"}
  planning: {name: "Project Planning Agent", role: "Turns project inputs into WBS and deliverable plan"}
  dependency_manager: {name: "Dependency Manager Agent", role: "Topological ordering of workstreams/tasks"}
  router: {name: "Agent Router", role: "Selects the right discipline agent for a topic/OIR"}
  exception_manager: {name: "Exception Manager Agent", role: "Handles tool failures, missing evidence, QA failures, conflicts"}
